<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#147d68">
<title>Kiwi Brain Quest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><h1>🥝 Kiwi Brain Quest <span class="app-version">v2.4.4</span></h1></div>
   
  </header>

  <section id="setup" class="panel stack">
    <label><span>Choose year</span>
      <select id="year">
        <option value="1">Year 1</option><option value="2">Year 2</option>
        <option value="3">Year 3</option><option value="4">Year 4</option>
        <option value="5">Year 5</option><option value="6">Year 6</option>
      </select>
    </label>
    <label><span>Learning area</span>
      <select id="category">
        <option value="all">Mixed topics</option>
        <option value="number">Number</option>
        <option value="algebra">Algebra &amp; patterns</option>
        <option value="measure">Measurement</option>
        <option value="geometry">Geometry &amp; space</option>
        <option value="statistics">Statistics &amp; data</option>
        <option value="probability">Probability</option>
      </select>
    </label>
    <div>
      <strong>Game mode</strong>
      <div class="two">
        <button id="normalBtn" class="primary">Normal mode</button>
        <button id="speedBtn" class="secondary">Speed mode</button>
      </div>
    </div>
    <div id="timerSettings" class="hidden">
      <strong>Timer difficulty</strong>
      <div class="three">
        <button data-time="0" class="secondary">Easy · 15 seconds</button>
        <button data-time="1" class="primary">Medium · 10 seconds</button>
        <button data-time="2" class="secondary">Hard · 6 seconds</button>
      </div>
      <p class="hint">Timer difficulty is separate from maths question difficulty.</p>
    </div>
    <button id="startBtn" class="primary start">Start game</button>
    <p class="hint">Normal: 10 questions · Speed: unlimited</p>
  </section>

  <section id="game" class="stack hidden">
    <div class="panel stats">
      <div><small>Question</small><strong id="progress">1 / 10</strong></div>
      <div><small>Score</small><strong id="score">0</strong></div>
      <div id="timerBox"><small>Time left</small><strong id="timer">10</strong></div>
    </div>
    <div id="timerBar" class="bar"><div id="timerFill"></div></div>
    <div id="adjustPanel" class="adjust-row compact-adjust hidden">
      <button id="easier" class="secondary">Easier</button>
      <button id="harder" class="secondary">Harder</button>
    </div>
    <div class="panel question-panel">
      <small id="strandName">Number</small>
      <div id="question" class="question">7 + 5 = ?</div>
      <div class="question-audio-controls"><button id="readQuestionBtn" class="read-question" type="button" aria-label="Read question aloud">🔊 Read question</button><button id="soundToggleBtn" class="sound-toggle" type="button" aria-pressed="true">🔊 Sound on</button></div>
    </div>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="panel hidden" aria-live="polite"></div>
    <div class="two game-controls">
      <button id="pauseBtn" class="secondary hidden">Pause</button>
      <button id="nextBtn" class="primary" disabled>Next question</button>
      <button id="exitBtn" class="secondary">Quit</button>
    </div>
  </section>

  <section id="result" class="panel stack hidden">
    <h2>Game over!</h2>
    <div id="finalScore" class="final-score">0 pts</div>
    <p id="resultDetail" class="hint"></p>
    <button id="againBtn" class="primary">Play again</button>
  </section>
</main>
<script src="app.js?v=2.4.4"></script>
</body>
</html>
